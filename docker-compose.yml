services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docstore
      POSTGRES_PASSWORD: docstore
      POSTGRES_DB: docstore
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache openssl >/dev/null
        mkdir -p /var/lib/postgresql/ssl
        [ -f /var/lib/postgresql/ssl/server.key ] || openssl req -new -x509 -days 3650 -nodes -subj "/CN=localhost" -keyout /var/lib/postgresql/ssl/server.key -out /var/lib/postgresql/ssl/server.crt
        chown postgres:postgres /var/lib/postgresql/ssl/*
        chmod 600 /var/lib/postgresql/ssl/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/ssl/server.crt -c ssl_key_file=/var/lib/postgresql/ssl/server.key
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  volume-permission-helper:
    image: alpine
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
      - rustfs_logs:/app/logs
    command: chown -R 10001:10001 /data/rustfs0 /data/rustfs1 /data/rustfs2 /data/rustfs3 /app/logs
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-docstoreadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-docstoreadmin}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
      - rustfs_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  bucket-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-docstoreadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-docstoreadmin}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - |
        E="aws --endpoint-url http://rustfs:9000"
        B=${S3_BUCKET:-docstore}
        $$E s3api head-bucket --bucket $$B 2>/dev/null || $$E s3api create-bucket --bucket $$B
        $$E s3api put-bucket-cors --bucket $$B --cors-configuration '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag","Content-Disposition"],"MaxAgeSeconds":3000}]}'
    restart: "no"

volumes:
  postgres_data:
  rustfs_data_0:
  rustfs_data_1:
  rustfs_data_2:
  rustfs_data_3:
  rustfs_logs:
